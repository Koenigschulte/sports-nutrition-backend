# Führt Dependabot-PRs automatisch zusammen, wenn die Build-Prüfung grün ist
# und es nur Patch-/Minor-Updates sind (angelegt 17.11.2026).
# Hauptversions-Sprünge bleiben offen und bekommen einen Hinweis-Kommentar.
name: Dependabot Auto-Merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Nur Patch-/Minor-Updates zusammenführen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state=="open")][0].number')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then echo "kein offener PR"; exit 0; fi
          text=$(gh pr view "$pr" -R "$REPO" --json title,body --jq '.title + "\n" + .body')
          if printf '%s' "$text" | python3 -c '
          import re, sys
          t = sys.stdin.read()
          pairs = re.findall(r"from v?(\d+)\.\S* to v?(\d+)\.", t)
          sys.exit(0 if pairs and all(a == b for a, b in pairs) else 1)'; then
            gh pr merge "$pr" -R "$REPO" --squash --delete-branch
          else
            gh pr comment "$pr" -R "$REPO" --body "Hauptversions-Sprung oder Versionen nicht erkennbar – kein automatisches Zusammenführen, bitte manuell prüfen."
          fi
